name: xue_hua_app_badge
description: "Cross-platform Flutter app badge plugin. Supports Android, iOS, macOS, Windows, and Linux via a unified set/remove/permission API."
version: 2.0.0
homepage: https://github.com/Matkurban/xue_hua_app_badge
repository: https://github.com/Matkurban/xue_hua_app_badge
topics:
  - badge
  - app

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_app_badge
        pluginClass: XueHuaAppBadgePlugin
      ios:
        pluginClass: XueHuaAppBadgePlugin
      linux:
        pluginClass: XueHuaAppBadgePlugin
      macos:
        pluginClass: XueHuaAppBadgePlugin
      windows:
        pluginClass: XueHuaAppBadgePluginCApi
